name: Déploiement Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:run

      - name: Construire le site
        run: npm run build

      - name: Déployer sur Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # Dossier du sous-domaine tohijri.kawwwa.fr sur Hostinger.
          # À vérifier/ajuster dans hPanel (Fichiers → Gestionnaire de fichiers
          # ou Comptes FTP) : le chemin exact dépend de la façon dont
          # kawwwa.fr est configuré sur l'hébergement.
          server-dir: ./public_html/tohijri/
